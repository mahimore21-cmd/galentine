<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galentine 💖</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      color: #d63384;
      margin-bottom: 30px;
      font-size: 1.8rem;
    }

    .buttons {
      position: relative;
      height: 150px;
    }

    button {
      padding: 12px 26px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, left 0.4s ease, top 0.4s ease;
      position: absolute;
    }

    #yesBtn {
      background: #ff4d8d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
    }

    #noBtn {
      background: #ffc2d6;
      color: #8a1c4a;
      left: 20%;
      top: 20%;
    }

    .celebrate {
      font-size: 1.6rem;
      color: #b5179e;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="container" id="container">
    <h1 id="question">Will you be my Galentine? 💗</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>
